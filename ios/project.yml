name: Bouquet
options:
  bundleIdPrefix: com.nicholai
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  BouquetCore:
    path: BouquetCore
targets:
  Bouquet:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: BouquetCore
      - target: BouquetShare
      - target: BouquetWidget
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Bouquet
        # bouquet://item/<id>: the widget's links into the reader.
        CFBundleURLTypes:
          - CFBundleURLName: com.nicholai.bouquet
            CFBundleURLSchemes: [bouquet]
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Tailscale's tunnel is encrypted; this lets a plain-HTTP tailnet address work too, as in Forge.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: App/Bouquet.entitlements
      properties:
        com.apple.security.application-groups: [group.com.nicholai.bouquet]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicholai.bouquet
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        PRODUCT_NAME: Bouquet
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  BouquetShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Share
      - path: App/Theme.swift
    dependencies:
      - package: BouquetCore
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: Bouquet
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: Share/BouquetShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.nicholai.bouquet]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicholai.bouquet.share
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        PRODUCT_NAME: BouquetShare
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  BouquetWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
    dependencies:
      - package: BouquetCore
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Bouquet
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/BouquetWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.nicholai.bouquet]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicholai.bouquet.widget
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        PRODUCT_NAME: BouquetWidget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  BouquetMac:
    type: application
    platform: macOS
    sources:
      - path: Mac
      - path: App/Theme.swift
      - path: App/TopicsSheet.swift
      - path: App/Lists/ItemRow.swift
      - path: App/Lists/SourceBadge.swift
      - path: App/Lists/FilterBar.swift
      - path: App/Settings/TopicsEditor.swift
      - path: App/Settings/FeedsEditor.swift
      - path: App/Reader/ArticlePage.swift
      - path: App/Reader/reader.css
        buildPhase: resources
    dependencies:
      - package: BouquetCore
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Bouquet
        LSApplicationCategoryType: public.app-category.news
        # Tailscale's tunnel is encrypted; this lets a plain-HTTP tailnet address work too.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: Mac/BouquetMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicholai.bouquet.mac
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        PRODUCT_NAME: Bouquet
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
