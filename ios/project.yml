name: Sprig
options:
  bundleIdPrefix: com.nicholai
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  SprigCore:
    path: SprigCore
targets:
  Sprig:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: SprigCore
      - target: SprigShare
      - target: SprigWidget
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Sprig
        # sprig://item/<id>: the widget's links into the reader.
        CFBundleURLTypes:
          - CFBundleURLName: com.nicholai.sprig
            CFBundleURLSchemes: [sprig]
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Tailscale's tunnel is encrypted; this lets a plain-HTTP tailnet address work too.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: App/Sprig.entitlements
      properties:
        com.apple.security.application-groups: [group.com.nicholai.sprig]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicholai.sprig
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        PRODUCT_NAME: Sprig
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  SprigShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Share
      - path: App/Theme.swift
    dependencies:
      - package: SprigCore
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: Sprig
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: Share/SprigShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.nicholai.sprig]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicholai.sprig.share
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        PRODUCT_NAME: SprigShare
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  SprigWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
    dependencies:
      - package: SprigCore
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Sprig
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/SprigWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.nicholai.sprig]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicholai.sprig.widget
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        PRODUCT_NAME: SprigWidget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  SprigMac:
    type: application
    platform: macOS
    sources:
      - path: Mac
      - path: App/Theme.swift
      - path: App/TopicsSheet.swift
      - path: App/Lists/ItemRow.swift
      - path: App/Lists/SourceBadge.swift
      - path: App/Lists/FilterBar.swift
      - path: App/Lists/UndoArchiveBar.swift
      - path: App/Settings/TopicsEditor.swift
      - path: App/Settings/FeedsEditor.swift
      - path: App/Reader/ArticlePage.swift
      - path: App/Reader/reader.css
        buildPhase: resources
    dependencies:
      - package: SprigCore
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Sprig
        LSApplicationCategoryType: public.app-category.news
        # Tailscale's tunnel is encrypted; this lets a plain-HTTP tailnet address work too.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: Mac/SprigMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicholai.sprig.mac
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        PRODUCT_NAME: Sprig
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
