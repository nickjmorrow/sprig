[project]
name = "sprig"
version = "0.1.0"
description = "Sprig server: saves, cleans, times and tags things to read."
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "fastapi",
    "feedparser",
    "httpx",
    "pypdf",
    "trafilatura",
    "uvicorn",
]

[project.scripts]
sprig = "sprig.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
